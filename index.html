<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora Express</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Express">
<meta name="theme-color" content="#EEF3F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1315" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)} input,select{font-size:16px}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>
/* Layout: one phone screen, no scrolling — compact inputs on top, a 2-column results grid, payment as the big number. */
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --tint:#E3ECEA; --line:#C3D2CF; --ink:#12232A; --muted:#5A6E72;
  --accent:#0B6B6B; --accent-ink:#FFFFFF; --gold:#9C7020; --ok:#2B7449; --warn:#A9481A; --warn-bg:#FBECE2;
  --f-display:'Sora', ui-sans-serif, system-ui, sans-serif;
  --f-body:'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1315; --surface:#132023; --tint:#1A2B2F; --line:#2D4246; --ink:#E3EDEB; --muted:#93A6A8;
  --accent:#45BBB2; --accent-ink:#062022; --gold:#D8AD58; --ok:#72CB97; --warn:#F2A473; --warn-bg:#36231A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1315; --surface:#132023; --tint:#1A2B2F; --line:#2D4246; --ink:#E3EDEB; --muted:#93A6A8;
  --accent:#45BBB2; --accent-ink:#062022; --gold:#D8AD58; --ok:#72CB97; --warn:#F2A473; --warn-bg:#36231A; color-scheme:dark }

*{box-sizing:border-box}
html{height:100%; box-sizing:border-box}
html,body{background:var(--bg)}
body{height:100%; margin:0}
body{color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.3}
.wrap{max-width:460px; min-height:100%; margin:0 auto; padding-inline:14px; padding-block:6px 8px; display:flex; flex-direction:column; gap:clamp(6px,1.4vh,14px)}

.top{display:flex; align-items:center; justify-content:space-between; height:32px}
.brand{font-family:var(--f-display); font-weight:700; font-size:17px; letter-spacing:-.01em}
.brand span{color:var(--accent)}
.icon-btn{border:0; background:transparent; color:var(--muted); width:34px; height:34px; border-radius:50%; display:grid; place-items:center; cursor:pointer}
.icon-btn:hover{background:var(--tint); color:var(--ink)}
button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.row{display:flex; gap:8px; align-items:stretch}
.row > *{flex:1; min-width:0}
.fld{position:relative; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); min-width:0}
.fld:focus-within{border-color:var(--accent)}
.fld label{position:absolute; top:-8px; left:8px; padding:0 4px; background:var(--surface); font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; max-width:calc(100% - 16px); overflow:hidden; text-overflow:ellipsis}
.fld input, .fld select{width:100%; border:0; background:transparent; color:var(--ink); font:600 clamp(16px,2.3vh,20px) var(--f-display); padding:clamp(10px,1.9vh,17px) 10px clamp(7px,1.5vh,14px); outline:none; font-variant-numeric:tabular-nums; appearance:none; -webkit-appearance:none; border-radius:10px}
.fld select{padding-right:30px; font-size:15px; cursor:pointer}
.fld.sel::after{content:""; position:absolute; right:12px; top:50%; width:7px; height:7px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:translateY(-70%) rotate(45deg); pointer-events:none}
.fld .unit{position:absolute; right:8px; top:50%; transform:translateY(-45%); color:var(--muted); font-weight:600; font-size:13px; pointer-events:none}

.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:3px; padding:3px; background:var(--tint); border-radius:10px}
.seg button{border:0; background:transparent; color:var(--muted); font:700 13.5px var(--f-body); padding:clamp(7px,1.4vh,12px) 4px; border-radius:8px; cursor:pointer; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pkg{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; padding-inline:2px; margin-top:-3px}
.pkg b{color:var(--ink)}
.pkg .ok{color:var(--ok); font-weight:700}

.trades{display:flex; flex-direction:column; gap:8px}
.trade{display:grid; grid-template-columns:1.3fr 1.1fr .85fr 34px; gap:6px; align-items:stretch}
.trade .fld input{font-size:15px; padding-inline:8px}
.sq{border:1.5px solid var(--line); background:var(--surface); color:var(--accent); border-radius:10px; font:700 18px var(--f-body); cursor:pointer; padding:0}
.sq.rm{color:var(--warn)}

.dp{display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:center}

.grid{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:clamp(6px,1.2vh,12px)}
.out{background:var(--tint); border-radius:12px; padding:8px 12px; display:flex; flex-direction:column; justify-content:center; font-variant-numeric:tabular-nums; min-width:0}
.out .k{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.out .v{font-family:var(--f-display); font-weight:700; font-size:clamp(18px,2.9vh,26px); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.out .s{font-size:11.5px; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.out.pay{background:var(--accent); color:var(--accent-ink)}
.out.pay .k, .out.pay .s{color:var(--accent-ink); opacity:.85}
.out.pay .v{font-size:clamp(21px,min(3.8vh,6.4vw),32px); overflow:visible}
@media (max-height:720px){ .out{padding:5px 10px} .out .s{font-size:10.5px} .out .k{font-size:10px} .pkg{font-size:11px} }
.out.inc .v{color:var(--gold); font-size:17px}
.grid{grid-template-rows:minmax(0,1fr) auto minmax(0,1.2fr) minmax(0,1fr); grid-auto-rows:auto; grid-template-areas:"fp inc" "dp dp" "pay pay" "int term"}
.a-fp{grid-area:fp}.a-dp{grid-area:dp}.a-pay{grid-area:pay}.a-int{grid-area:int}.a-term{grid-area:term}.a-inc{grid-area:inc}
.out.a-pay{display:grid; grid-template-columns:1fr auto; align-content:center; column-gap:12px}
.out.a-pay .k{grid-column:1} .out.a-pay .v{grid-column:2; grid-row:1 / span 2; align-self:center; text-align:right}
.termcell{display:flex; flex-direction:column; justify-content:center}
.termcell .seg{height:100%}
.termcell .seg button{font-size:clamp(13px,1.9vh,16px)}

.flag{background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:6px 10px; font-size:12.5px; font-weight:600}
.credit{text-align:center; font-size:11.5px; color:var(--muted); margin:2px 0 0}
.credit b{color:var(--ink)}

.sheet{flex:1; display:flex; flex-direction:column; gap:clamp(5px,1vh,10px); min-height:0}
.line{flex:1; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; background:var(--tint); border-radius:12px; padding:6px 12px; font-variant-numeric:tabular-nums; min-height:0}
.line .k{font-size:clamp(11px,1.6vh,13px); font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.line .s{font-size:11.5px; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.line .v{font-family:var(--f-display); font-weight:700; font-size:clamp(19px,3vh,26px); text-align:right; white-space:nowrap}
.line.pay{flex:1.3; background:var(--accent); color:var(--accent-ink)}
.line.pay .k,.line.pay .s{color:var(--accent-ink); opacity:.85}
.line.pay .v{font-size:clamp(24px,4vh,34px)}
.line.inc{grid-template-columns:1fr auto 1fr; gap:6px}
.line.inc .ic .v{color:var(--gold); font-size:clamp(17px,2.6vh,22px); text-align:left}
.line.inc .ic.r{text-align:right} .line.inc .ic.r .v{text-align:right}
.line.inc .or{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.08em}
.seg.mini{margin-top:4px; padding:2px; gap:2px; display:inline-grid}
.seg.mini button{padding:5px 9px; font-size:12.5px}
.line > .seg.mini{margin-top:0; min-width:150px}
.line > .seg.mini button{padding:7px 12px; font-size:14px}
.dpsel{margin-top:4px; width:112px} .dpsel select{font-size:15px; padding:7px 28px 6px 10px}
.dpf{width:clamp(130px,38vw,170px)}
.dpf input{text-align:right}
/* Key rows: Final Price, Down Payment, Monthly Payments — same weight, same size */
.line.key{flex:1.25; background:var(--surface); border:2px solid var(--accent)}
.line.key .k{color:var(--accent); font-size:clamp(12px,1.7vh,14px)}
.line.key .s{opacity:1}
.line.key .v, .line.key .dpf input{font-family:var(--f-display); font-weight:700; font-size:clamp(21px,3.2vh,27px); color:var(--ink)}
.line.key.pay{background:var(--surface); color:var(--ink)}
.line.key.pay .k{color:var(--accent); opacity:1}
.line.key.pay .s{color:var(--muted); opacity:1}
.line.key.pay .v{font-size:clamp(21px,3.2vh,27px)}
.line:not(.key) .v{font-size:clamp(16px,2.4vh,20px)}
.line:not(.key){flex:.85}
#encBox{flex:1.35} #encBox input{font-size:13.5px; padding-inline:4px} .row > .fld:has(#price){flex:.75}
@media (max-height:720px){ .line{padding:3px 10px} #oFinalS,#oRateS{display:none} .seg.mini{margin-top:2px} .seg.mini button{padding:4px 8px} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Calculadora <span>Express</span></div>
    <button class="icon-btn" id="reset" title="Clear all" aria-label="Clear all">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
  </header>

  <div class="row">
    <div class="fld"><label for="cp">CP Owned</label><input id="cp" inputmode="numeric" data-fmt="int"></div>
    <div class="fld" id="encBox" hidden><label for="encDate">Encore Date</label><input id="encDate" type="date" style="font-size:14px; padding-inline:6px"></div>
    <div class="fld"><label for="price">Price</label><input id="price" inputmode="decimal"></div>
  </div>

  <div class="row">
    <div class="seg" id="mode"><button type="button" data-v="lvl">OBL</button><button type="button" data-v="opt">Options</button></div>
    <div class="fld sel" id="prodBox"><label for="prod">Program</label><select id="prod"><option value="EY">Annual</option><option value="EOY">EOY</option><option value="ENC_EY">Encore Annual</option><option value="ENC_EOY">Encore EOY</option></select></div>
  </div>

  <div class="fld sel" id="lvlBox"><label for="lvl">Owner Benefit Level (OBL)</label><select id="lvl"></select></div>
  <div class="fld" id="optBox" hidden><label for="opts">Options</label><input id="opts" inputmode="numeric" data-fmt="int"></div>
  <div class="pkg" id="pkg"></div>

  <div class="trades" id="trades"></div>

  <div class="sheet">
    <div class="line key"><div><div class="k">Final Price</div><div class="s" id="oFinalS"></div></div><div class="v" id="oFinal">$0</div></div>
    <div class="line key"><div><div class="k">Down Payment</div>
      <div class="fld sel dpsel"><select id="dpMode" aria-label="Down payment %"><option value="10">10%</option><option value="15">15%</option><option value="20">20%</option><option value="man">Manual</option></select></div></div>
      <div class="fld dpf"><label for="dpAmt">New Money</label><input id="dpAmt" inputmode="decimal" data-fmt="money"></div></div>
    <div class="line key pay"><div><div class="k">Monthly Payments</div><div class="s" id="oPayS"></div></div><div class="v" id="oPay">$0</div></div>
    <div class="line"><div><div class="k">Interest</div><div class="s" id="oRateS"></div></div><div class="v" id="oRate">0%</div></div>
    <div class="line"><div class="k">Months</div><div class="seg mini" id="term"><button type="button" data-v="120">120</button><button type="button" data-v="180">180</button></div></div>
    <div class="line inc"><div class="ic"><div class="k">Bonus Options</div><div class="v" id="oBO">—</div></div><div class="or">OR</div><div class="ic r"><div class="k">Tier</div><div class="v" id="oTier">—</div></div></div>
  </div>
  <div class="flag" id="flag" hidden></div>

  <p class="credit">Designed by <b>Vittorio Zangari</b></p>
</div>

<script>
const C = 30.03211199470145;
const MINS = {EY:37000, EOY:50000};
const LIST = {EY:0.498, EOY:0.571};
const BASE = p => p.endsWith('EOY') ? 'EOY' : 'EY';
// Encore Price Freeze — Aventuras rows from 6/30/2025 on (same as the Pro). 18-month freeze window.
const FREEZE = [['2026-09-30',0.498,0.571],['2026-06-30',0.498,0.571],['2026-03-31',0.498,0.571],['2025-09-30',0.495,0.568],['2025-07-31',0.495,0.568],['2025-06-30',0.495,0.568]];
function encorePrice(dateStr, base){
  const col = base === 'EOY' ? 2 : 1;
  if (!dateStr) return null;
  const sale = new Date(dateStr + 'T12:00:00'), lim = new Date(); lim.setMonth(lim.getMonth() - 18);
  if (sale < lim) return {p:FREEZE[0][col], note:'Over 18 months · current price'};
  const row = FREEZE.find(r => r[0] <= dateStr) || FREEZE[FREEZE.length - 1];
  const [y,m,d] = row[0].split('-');
  return {p:row[col], note:`Price freeze ${+m}/${+d}/${y}`};
}
const ENC = () => S.prod.startsWith('ENC');
const LEVELS = [['Select',4000],['Executive',7000],['Presidential',10000],["Chairman's Club",15000],['Reserve',25000],['Pinnacle',40000]];
// Owner / Reload rates, MVW grid Sep 9 2026 (same as COTIZA)
const RATES = {120:{10:17.24, 20:15.99, lab:'FICO 600'}, 180:{10:16.49, 20:16.49, lab:'FICO 640'}};
const CHAMP = 9.99;
// Premier Vacations tier by Net incremental (WAC Annual, Oct 20 2026 matrix)
const TIERS = [[373998,'Tier 25'],[224598,'Tier 20'],[149898,'Tier 15'],[105078,'Tier 10'],[75198,'Tier 5'],[45318,'Tier 3'],[22908,'Tier 1']];
// Matrix packages: every 1,000 from 25,000 plus the published odd sizes
const PKGS = [20700,25800,30500,51700,67100,95700,134200,148100,176700];
for (let p = 25000; p <= 999000; p += 1000) PKGS.push(p);
PKGS.sort((a,b) => a-b);

const DEF = {cp:'3,000', price:'', mode:'lvl', prod:'EY', lvl:'10000', opts:'', trades:[{p:'25,000', d:'2,000', r:'13.99', auto:false}], dpMode:'10', dpAmt:'', term:'120', encDate:''};
const KEY = 'aventuraExpres.v2';
let S; try { S = Object.assign(structuredClone(DEF), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){ S = structuredClone(DEF); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const $ = id => document.getElementById(id);
const P = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g,'')); return isNaN(n) ? 0 : n; };
const has = v => String(v ?? '').trim() !== '';
const m0 = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const m2 = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
const i0 = n => Math.round(n).toLocaleString('en-US');
const c2 = n => Math.round(n*100)/100;
const pmt = (A, rate, n) => { const i = rate/1200; return i === 0 ? A/n : A*i/(1 - Math.pow(1+i, -n)); };

// Club Points per package, as the WAC pricing matrix shows them: Options ÷ 30.032, rounded to the nearest 5
const cpOf = o => Math.round(o / C / 5) * 5;
function calc(){
  const eoy = BASE(S.prod) === 'EOY', div = eoy ? 2 : 1;
  const price = has(S.price) ? P(S.price) : LIST[BASE(S.prod)];
  const MIN = MINS[BASE(S.prod)];
  const cp = P(S.cp);
  const reached = S.mode === 'lvl' && cp >= P(S.lvl);
  let opts;
  if (S.mode === 'lvl'){
    const miss = Math.max(0, P(S.lvl) - cp);
    opts = MIN;
    while (cpOf(opts) / div < miss) opts += 1000;
  } else opts = Math.max(MIN, Math.round(P(S.opts)));
  const list = Math.round(opts * price / div);
  const tr = S.trades.map(t => ({p:P(t.p), d:Math.min(P(t.d), P(t.p)), r:P(t.r)})).filter(t => t.p > 0);
  const tradeCredit = tr.reduce((a,t) => a + t.p, 0);
  const equity = tr.reduce((a,t) => a + t.d, 0);
  const netInc = list - tradeCredit;
  const pct = netInc >= 47000 ? 20 : netInc >= 33000 ? 15 : netInc >= 14000 ? 10 : 0;
  const disc = Math.round(Math.max(0, netInc) * pct / 100);
  const closing = tr.length ? 1225 + 150 * (tr.length - 1) : 925;
  const finalPrice = netInc - disc + closing;
  const base = list - disc;
  // 20% rate needs 20% NEW money on the incremental amount; equity does not count toward it
  const incr = Math.max(0, netInc - disc);
  const newMoney = S.dpMode === 'man' ? Math.max(0, c2(P(S.dpAmt)))
    : S.dpMode === '20' ? Math.max(0, c2(base * 0.20 - equity), c2(incr * 0.20))
    : Math.max(0, c2(base * P(S.dpMode) / 100 - equity));
  const dp = c2(equity + newMoney);
  const dpPct = base > 0 ? dp / base * 100 : 0;
  const amount = c2(base - (equity + newMoney) + closing);
  const oldBal = tr.reduce((a,t) => a + (t.p - t.d), 0);
  const oldInt = tr.reduce((a,t) => a + (t.p - t.d) * t.r, 0);
  const champ = S.term === '180' && netInc >= 200000;
  const tierDP = incr > 0 && newMoney >= c2(incr * 0.20) - 0.005 ? 20 : 10;
  const newRate = champ ? CHAMP : RATES[S.term][tierDP];
  let rate = newRate;
  if (!champ && oldBal > 0 && amount > 0) rate = c2((oldInt + (amount - oldBal) * newRate) / amount);
  const pay = amount > 0 ? pmt(amount, rate, +S.term) : 0;
  const tier = eoy ? null : (TIERS.find(t => netInc >= t[0]) || [0,null])[1];
  let pk = 0; for (const p of PKGS){ if (Math.round(p * price / div) <= netInc) pk = p; else break; }
  const bo = pk / div;
  const newCP = cpOf(opts) / div;
  const cpAfter = cp + newCP;
  return {newCP, eoy, price, cp, reached, opts, list, tr, equity, netInc, pct, disc, closing, finalPrice, base, dp, dpPct, newMoney, amount, oldBal, champ, newRate, rate, pay, tier, bo, cpAfter};
}

function renderLevels(){
  const cp = P(S.cp);
  $('lvl').innerHTML = '<option value="">Select OBL…</option>' + LEVELS.map(([n,t]) => `<option value="${t}">${n} · ${i0(t)}${cp >= t ? ' · Reached ✓' : ''}</option>`).join('');
  $('lvl').value = S.lvl;
}

function renderTrades(){
  $('trades').innerHTML = S.trades.map((t,i) => `
    <div class="trade">
      <div class="fld"><label for="tp${i}">Trade-in${S.trades.length > 1 ? ' ' + (i+1) : ''}</label><input id="tp${i}" data-i="${i}" data-f="p" data-fmt="int" inputmode="decimal" value="${t.p}"></div>
      <div class="fld"><label for="td${i}">Paid</label><input id="td${i}" data-i="${i}" data-f="d" data-fmt="int" inputmode="decimal" value="${t.d}"></div>
      <div class="fld"><label for="tr${i}">Int</label><input id="tr${i}" data-i="${i}" data-f="r" inputmode="decimal" value="${t.r}"><span class="unit">%</span></div>
      ${i === 0 ? (S.trades.length < 2 ? '<button type="button" class="sq" id="add" aria-label="Add second contract">+</button>' : '<span></span>')
               : `<button type="button" class="sq rm" data-rm="${i}" aria-label="Remove contract">−</button>`}
    </div>`).join('');
}

function blank(){
  $('pkg').innerHTML = S.mode === 'lvl' ? 'Pick an OBL to quote.' : 'Enter the Options to quote.';
  ['oFinal','oPay','oRate','oTier','oBO'].forEach(id => $(id).textContent = '—');
  ['oFinalS','oPayS','oRateS'].forEach(id => $(id).textContent = '');
  if (document.activeElement !== $('dpAmt') && S.dpMode !== 'man') $('dpAmt').value = '';
  $('flag').hidden = true;
  save();
}
function render(){
  $('price').placeholder = ENC() ? 'Encore price' : LIST[BASE(S.prod)].toFixed(3);
  if ((S.mode === 'lvl' && !S.lvl) || (S.mode === 'opt' && !has(S.opts))) return blank();
  const R = calc();
  $('price').placeholder = ENC() ? 'Encore price' : LIST[BASE(S.prod)].toFixed(3);
  $('price').closest('.fld').style.borderColor = ENC() && !has(S.price) ? 'var(--warn)' : '';
  if (S.mode === 'lvl' && R.reached)
    $('pkg').innerHTML = `<span class="ok">Already reached</span> · ${i0(R.cp)} CP · min sale <b>${i0(R.opts)}</b> Options · list ${m0(R.list)}`;
  else
    $('pkg').innerHTML = `<b>${i0(R.opts)}</b> Options · list ${m0(R.list)}${R.pct ? ` · ${R.pct}% off` : ''} · ${R.eoy ? `${i0(cpOf(R.opts))} CP EOY, counts +${i0(R.newCP)}` : `+${i0(R.newCP)} CP`} = ${i0(R.cpAfter)} CP`;

  if (document.activeElement !== $('dpAmt') && S.dpMode !== 'man') $('dpAmt').value = R.newMoney.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});

  $('oFinal').textContent = m0(R.finalPrice);
  $('oFinalS').textContent = `Closing ${m0(R.closing)} incl.`;
  $('oRate').textContent = R.rate.toFixed(2) + '%';
  $('oRateS').textContent = R.champ ? 'Champion · no blend' : `${RATES[S.term].lab} · new ${R.newRate.toFixed(2)}%`;
  $('oPay').textContent = m2(R.pay);
  $('oPayS').textContent = `× ${S.term} months`;
  $('oTier').textContent = R.tier || 'No tier';
  $('oBO').textContent = R.bo ? i0(R.bo) : 'None';

  const f = [];
  const bk = BASE(S.prod);
  if (S.mode === 'opt' && has(S.opts) && P(S.opts) < MINS[bk]) f.push(`Minimum ${bk === 'EOY' ? 'EOY' : 'Annual'} sale is ${i0(MINS[bk])} Options — calculated at ${i0(MINS[bk])}.`);
  if (ENC() && !has(S.price)) f.push(`Pick the Encore sale date or type the price (using ${LIST[bk].toFixed(3)} for now).`);
  const ep = ENC() ? encorePrice(S.encDate, bk) : null;
  if (ep) $('pkg').innerHTML += ` · <b>${ep.note}</b>`;
  if (S.dpMode === 'man' && R.dpPct < 10 - 1e-9) f.push('New money + equity is below 10% down payment.');
  if (R.amount > 0 && R.amount < 7000) f.push('Minimum amount to finance is $7,000.');
  if (R.amount > 100000) f.push('Goes to Credit Committee.');
  $('flag').hidden = !f.length; $('flag').innerHTML = f.join('<br>');
  save();
}

function setSeg(id, v){ $(id).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }
function fill(){
  $('encBox').hidden = !ENC(); $('encDate').value = S.encDate || '';
  $('cp').value = S.cp; $('price').value = S.price; $('opts').value = S.opts;
  $('dpAmt').value = S.dpMode === 'man' ? S.dpAmt : '';
  $('dpAmt').readOnly = S.dpMode !== 'man';
  setSeg('mode', S.mode); $('prod').value = S.prod; $('dpMode').value = S.dpMode; setSeg('term', S.term);
  $('lvlBox').hidden = S.mode !== 'lvl'; $('optBox').hidden = S.mode !== 'opt';
  renderLevels(); renderTrades();
}

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'cp'){ S.cp = el.value; renderLevels(); }
  else if (el.id === 'price') S.price = el.value;
  else if (el.id === 'opts') S.opts = el.value;
  else if (el.id === 'dpAmt'){ S.dpAmt = el.value; }
  else if (el.dataset.i !== undefined){
    const t = S.trades[+el.dataset.i]; t[el.dataset.f] = el.value;
    if (el.dataset.f === 'd') t.auto = false;
    if (el.dataset.f === 'p' && t.auto !== false){ t.d = el.value; $('td' + el.dataset.i).value = el.value; }
  }
  else return;
  render();
});
document.addEventListener('focusout', e => {
  const el = e.target; if (!el.dataset || !el.dataset.fmt || !has(el.value)) return;
  el.value = el.dataset.fmt === 'money' ? P(el.value).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}) : i0(P(el.value));
  if (el.id === 'cp') S.cp = el.value; else if (el.id === 'opts') S.opts = el.value;
  else if (el.id === 'dpAmt' && S.dpMode === 'man') S.dpAmt = el.value;
  else if (el.dataset.i !== undefined){ const t = S.trades[+el.dataset.i]; t[el.dataset.f] = el.value; if (el.dataset.f === 'p' && t.auto !== false){ t.d = el.value; $('td' + el.dataset.i).value = el.value; } }
  save();
});
$('lvl').addEventListener('change', e => { S.lvl = e.target.value; render(); });
$('dpMode').addEventListener('change', e => { S.dpMode = e.target.value;
  if (S.dpMode === 'man' && !has(S.dpAmt)) S.dpAmt = calc().newMoney.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  fill(); render(); if (S.dpMode === 'man') $('dpAmt').focus(); });
function applyEncore(){ const ep = ENC() ? encorePrice(S.encDate, BASE(S.prod)) : null; S.price = ep ? ep.p.toFixed(3) : ''; $('price').value = S.price; }
$('prod').addEventListener('change', e => { S.prod = e.target.value; $('encBox').hidden = !ENC(); applyEncore(); render(); if (ENC() && !S.encDate) $('encDate').focus(); });
$('encDate').addEventListener('change', e => { S.encDate = e.target.value; applyEncore(); render(); });
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const seg = b.closest('.seg');
  if (seg){
    const k = seg.id, v = b.dataset.v;
    if (k === 'mode' && v === 'opt' && !has(S.opts) && S.lvl) S.opts = i0(calc().opts);
    if (k === 'prod' && v !== S.prod) S.price = '';
    if (k === 'dpMode' && v === 'man' && !has(S.dpAmt)) S.dpAmt = calc().newMoney.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
    S[k] = v; fill(); render();
    if (k === 'mode' && v === 'opt') $('opts').focus();
    if (k === 'dpMode' && v === 'man') $('dpAmt').focus();
    return;
  }
  if (b.id === 'add'){ S.trades.push({p:'', d:'', r:'', auto:true}); renderTrades(); render(); $('tp1').focus(); return; }
  if (b.dataset.rm !== undefined){ S.trades.splice(+b.dataset.rm, 1); renderTrades(); render(); return; }
  if (b.id === 'reset'){ S = structuredClone(DEF); Object.assign(S, {cp:'', lvl:'', opts:'', price:'', encDate:'', dpAmt:'', trades:[{p:'', d:'', r:'', auto:true}]}); fill(); render(); $('cp').focus(); }
});

fill(); render();
</script>

<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
